            else if (currentTab === 'logistics') content.innerHTML = getLogisticsHTML();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'text-indigo-600'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.add('text-gray-400'));
            
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('active', 'text-indigo-600');
            activeBtn.classList.remove('text-gray-400');
            
            render();
            window.scrollTo(0, 0);
        }

            selectedDay = day;
